<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="nowplaying">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>nowplaying</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Mochiy+Pop+One&family=Syne:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-night">
<div class="bg" aria-hidden="true"></div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-inner">
    <span class="eq eq-lg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <div class="loading-title">nowplaying</div>
    <div class="loading-sub">音楽をよみこみ中…</div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<main id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text">Now Playing</span>
      <span id="source-badge" class="badge" hidden></span>
      <a id="connect-link" class="badge badge-link" href="http://127.0.0.1:8080/auth/login" hidden>Spotify API に接続</a>
    </div>

    <div class="top-right">
      <div class="clock-wrap">
        <div id="clock" class="clock"></div>
        <div id="date" class="date"></div>
      </div>
      <button id="theme-toggle-btn" class="icon-btn" title="テーマ切り替え" aria-label="テーマ切り替え">
        <svg class="ico ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="fullscreen-btn" class="icon-btn" title="全画面表示" aria-label="全画面表示">
        <svg class="ico" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <section class="stage">
    <div class="hero">
      <div class="art-wrap">
        <div class="vinyl" aria-hidden="true"></div>
        <div class="art-frame">
          <img id="art" class="art" alt="" hidden>
        </div>
      </div>

      <div class="info">
        <p id="album" class="eyebrow"></p>
        <h1 id="track" class="track">何も再生していません</h1>
        <h2 id="artist" class="artist">Spotify で曲を再生するとここに表示されます</h2>
        <div id="meta-chips" class="chips" hidden>
          <span id="chip-bpm" class="chip" hidden></span>
          <span id="chip-key" class="chip" hidden><i class="chip-dot"></i><span id="chip-key-text"></span></span>
        </div>

        <div class="progress-block">
          <div class="progress"><div id="bar"></div></div>
          <div class="progress-times">
            <span id="time-display">0:00</span>
            <span id="progress-time">0:00</span>
          </div>
        </div>

        <div class="playback-controls">
          <button id="shuffle-btn" class="icon-btn" title="シャッフル: オフ" aria-label="シャッフル">
            <svg class="ico" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button id="prev-btn" class="icon-btn icon-btn-lg" title="前の曲" aria-label="前の曲">
            <svg class="ico-fill" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button id="play-pause-btn" class="icon-btn play-btn" title="再生 / 一時停止" aria-label="再生 / 一時停止">
            <svg id="play-icon" class="ico-fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" class="ico-fill" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button id="next-btn" class="icon-btn icon-btn-lg" title="次の曲" aria-label="次の曲">
            <svg class="ico-fill" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <button id="repeat-btn" class="icon-btn" data-mode="off" title="ループしない" aria-label="リピート">
            <svg class="ico" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          </button>
          <label class="volume" title="音量">
            <svg class="ico" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="50" aria-label="音量">
          </label>
        </div>
      </div>
    </div>

    <section class="recent" id="recent-tracks">
      <div class="recent-head">
        <h3>Recently played</h3>
        <div class="stats" aria-label="Last.fm 再生数">
          <span class="stat"><i>今日</i><b id="stat-day">–</b></span>
          <span class="stat"><i>7日</i><b id="stat-week">–</b></span>
          <span class="stat"><i>今月</i><b id="stat-month">–</b></span>
        </div>
      </div>
      <div id="recent-tracks-list" class="recent-list"></div>
    </section>
  </section>

  <aside class="side">
    <section class="card lyrics-container">
      <div class="card-head">
        <h3>Lyrics</h3>
        <span id="lyrics-source" class="tag" hidden></span>
      </div>
      <div id="lyrics-display" class="lyrics-display">
        <div id="ads-display" class="lyrics-note" hidden>広告を再生中…</div>
        <div id="lyrics-content" class="lyrics-content"></div>
      </div>
    </section>

    <section id="music-evaluation" class="card review">
      <h3>Gemini Review</h3>
      <div id="music-evaluation-content" class="music-evaluation-content"></div>
    </section>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
